name: Deploy

# Runs only after CI has finished on `main`, and only for a run that actually
# passed. `workflow_run` is what makes that possible without duplicating a single
# step of ci.yml: the suite is defined once, and this workflow consumes its
# verdict. Copying the jobs here instead would mean two definitions of "green"
# that drift apart, and twice the runner minutes on every push.
#
# Deploys go to Railway, which — unlike Render and Vercel — publishes no deploy
# hook URL, so the steps below drive its CLI with a project token instead of
# POSTing to a secret address. DEPLOYMENT.md, "Automated deploys", covers the
# secrets this needs and why Railway's own GitHub auto-deploy should be turned
# off if you want this gate to mean anything.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  # A manual escape hatch for redeploying an unchanged commit — a rolled-back
  # environment variable, say. It is still gated on DEPLOY_ENABLED below.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: trigger the Railway deploys
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `workflow_run` fires on failure and cancellation too, so the conclusion has
    # to be checked explicitly or a red suite would still deploy — which is the
    # one thing this workflow exists to prevent. `workflow_dispatch` has no
    # upstream run, so it passes on the first clause.
    #
    # The repository is public, and `branches: [main]` above matches the head
    # branch *name*: a fork's pull request from its own branch called `main`
    # passes it, and this job would then run with our secrets and deploy the
    # fork's commit (`head_sha`). So the CI run must also be a push, to this
    # repository. A manual dispatch is limited to `main` for the same reason.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)

    steps:
      # Disabled by default, and deliberately not an `if:` on the job. A fork or
      # a fresh clone has no secrets, so it must be impossible to deploy by
      # accident; setting DEPLOY_ENABLED to `true` is the single opt-in, and the
      # resting state is a green skip rather than a red failure. Secrets cannot
      # be read in a job-level `if:`, so the gate lives in the first step and
      # publishes its verdict to the ones after it.
      - name: Decide whether deploys are enabled
        id: gate
        env:
          DEPLOY_ENABLED: ${{ secrets.DEPLOY_ENABLED }}
        run: |
          if [ "$DEPLOY_ENABLED" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Deploys are enabled for this repository."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Deploys are disabled: repository secret DEPLOY_ENABLED is not 'true'."
            echo "See DEPLOYMENT.md, 'Automated deploys', to turn this on."
          fi

      # Railway has no deploy-hook URL to POST to, unlike Render and Vercel, so
      # each service is deployed through Railway's public GraphQL API with the
      # project token. `serviceInstanceDeployV2` takes an explicit `commitSha`:
      # Railway builds the service from its connected GitHub repo at exactly
      # that commit.
      #
      # The commit is the one CI just passed on (`workflow_run.head_sha`), or
      # the dispatched ref's head for a manual run. It is never "whatever Railway
      # deployed last". `railway redeploy`, which this step used to call, does
      # the latter: it rebuilds the service's latest deployment, commit and all.
      # So if Railway's own GitHub trigger stopped delivering pushes, a green
      # run here would have rebuilt the stale commit and looked like a deploy.
      #
      # Each service is independently optional: deploying only the API, or only
      # the client, is a legitimate setup and should not fail the run. A service
      # secret may hold the service's name or its id, as DEPLOYMENT.md says.
      - name: Deploy both services at the commit CI passed
        if: steps.gate.outputs.enabled == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          API_SERVICE: ${{ secrets.RAILWAY_API_SERVICE }}
          WEB_SERVICE: ${{ secrets.RAILWAY_WEB_SERVICE }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          # The default shell is `bash -e` without pipefail; a failed API call
          # piped into jq must still fail the step.
          set -o pipefail

          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN is not set; skipping both deploys."
            exit 0
          fi

          # One GraphQL call. Fails the step on an HTTP error or on a GraphQL
          # `errors` array, which Railway returns with a 200 status.
          gql() {
            local body response
            body=$(jq -n --arg q "$1" --argjson v "$2" '{query: $q, variables: $v}')
            response=$(curl --silent --show-error --fail-with-body \
              --header "Project-Access-Token: $RAILWAY_TOKEN" \
              --header "Content-Type: application/json" \
              --data "$body" \
              https://backboard.railway.com/graphql/v2)
            if echo "$response" | jq -e '.errors // empty | length > 0' > /dev/null; then
              echo "Railway API error: $(echo "$response" | jq -c '.errors')" >&2
              return 1
            fi
            echo "$response"
          }

          # A project token is bound to one project and one environment, so both
          # ids come from the token itself rather than from two more secrets.
          scope=$(gql 'query { projectToken { projectId environmentId } }' '{}')
          project_id=$(echo "$scope" | jq -r '.data.projectToken.projectId')
          environment_id=$(echo "$scope" | jq -r '.data.projectToken.environmentId')
          services=$(gql 'query($id: String!) { project(id: $id) { services { edges { node { id name } } } } }' \
            "$(jq -n --arg id "$project_id" '{id: $id}')")

          deploy() {
            local label=$1 wanted=$2 service_id deployment_id
            if [ -z "$wanted" ]; then
              echo "No service configured for the $label; skipping it."
              return 0
            fi
            service_id=$(echo "$services" | jq -r --arg s "$wanted" \
              '.data.project.services.edges[].node | select(.id == $s or .name == $s) | .id')
            if [ -z "$service_id" ]; then
              echo "No service named or with id '$wanted' in this project." >&2
              return 1
            fi
            deployment_id=$(gql \
              'mutation($e: String!, $s: String!, $sha: String!) { serviceInstanceDeployV2(environmentId: $e, serviceId: $s, commitSha: $sha) }' \
              "$(jq -n --arg e "$environment_id" --arg s "$service_id" --arg sha "$COMMIT_SHA" '{e: $e, s: $s, sha: $sha}')" \
              | jq -r '.data.serviceInstanceDeployV2 // empty')
            if [ -z "$deployment_id" ]; then
              echo "Railway returned no deployment id for the $label." >&2
              return 1
            fi
            echo "Railway queued deployment $deployment_id of the $label at $COMMIT_SHA."
          }

          deploy "API service" "$API_SERVICE"
          deploy "web service" "$WEB_SERVICE"

      # A queued deployment means the platform accepted a build, not that the
      # build succeeded. Say so, rather than letting a green check here be read
      # as a green deploy.
      - name: Summarise
        run: |
          if [ "${{ steps.gate.outputs.enabled }}" != "true" ]; then
            {
              echo "### Deploy skipped"
              echo "\`DEPLOY_ENABLED\` is not set to \`true\`. See DEPLOYMENT.md."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Railway deploy requested at \`${{ github.event.workflow_run.head_sha || github.sha }}\`"
            echo "Railway has **queued** a build for each configured service. Watch the"
            echo "project dashboard for the outcome — a queued build is not a finished one."
          } >> "$GITHUB_STEP_SUMMARY"
