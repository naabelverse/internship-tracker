name: Deploy

# Runs only after CI has finished on `main`, and only for a run that actually
# passed. `workflow_run` is what makes that possible without duplicating a single
# step of ci.yml: the suite is defined once, and this workflow consumes its
# verdict. Copying the jobs here instead would mean two definitions of "green"
# that drift apart, and twice the runner minutes on every push.
#
# Deploys go to Railway, which — unlike Render and Vercel — publishes no deploy
# hook URL, so the steps below drive its CLI with a project token instead of
# POSTing to a secret address. DEPLOYMENT.md, "Automated deploys", covers the
# secrets this needs and why Railway's own GitHub auto-deploy should be turned
# off if you want this gate to mean anything.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  # A manual escape hatch for redeploying an unchanged commit — a rolled-back
  # environment variable, say. It is still gated on DEPLOY_ENABLED below.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: trigger the Railway deploys
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `workflow_run` fires on failure and cancellation too, so the conclusion has
    # to be checked explicitly or a red suite would still deploy — which is the
    # one thing this workflow exists to prevent. `workflow_dispatch` has no
    # upstream run, so it passes on the first clause.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      # Disabled by default, and deliberately not an `if:` on the job. A fork or
      # a fresh clone has no secrets, so it must be impossible to deploy by
      # accident; setting DEPLOY_ENABLED to `true` is the single opt-in, and the
      # resting state is a green skip rather than a red failure. Secrets cannot
      # be read in a job-level `if:`, so the gate lives in the first step and
      # publishes its verdict to the ones after it.
      - name: Decide whether deploys are enabled
        id: gate
        env:
          DEPLOY_ENABLED: ${{ secrets.DEPLOY_ENABLED }}
        run: |
          if [ "$DEPLOY_ENABLED" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Deploys are enabled for this repository."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Deploys are disabled: repository secret DEPLOY_ENABLED is not 'true'."
            echo "See DEPLOYMENT.md, 'Automated deploys', to turn this on."
          fi

      # Railway has no deploy-hook URL to POST to, unlike Render and Vercel.
      # Deployment goes through its CLI, authenticated by a project token, so the
      # CLI has to be on the runner before either service can be told to deploy.
      - name: Install the Railway CLI
        if: steps.gate.outputs.enabled == 'true'
        run: npm install -g @railway/cli

      # Each service is independently optional: deploying only the API, or only
      # the client, is a legitimate setup and should not fail the run.
      #
      # `railway redeploy` rebuilds the service from the commit its GitHub
      # connection already points at, which is this one — CI has just passed on
      # it. `railway up` would instead upload the runner's working directory as
      # an ad-hoc build context: the same code by a less traceable route, and it
      # detaches the deployment from the commit history Railway shows you.
      - name: Deploy the API service
        if: steps.gate.outputs.enabled == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE: ${{ secrets.RAILWAY_API_SERVICE }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$SERVICE" ]; then
            echo "RAILWAY_TOKEN or RAILWAY_API_SERVICE is not set; skipping the API deploy."
            exit 0
          fi
          railway redeploy --service "$SERVICE" --yes
          echo "Railway accepted a redeploy for the API service."

      - name: Deploy the web service
        if: steps.gate.outputs.enabled == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE: ${{ secrets.RAILWAY_WEB_SERVICE }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$SERVICE" ]; then
            echo "RAILWAY_TOKEN or RAILWAY_WEB_SERVICE is not set; skipping the client deploy."
            exit 0
          fi
          railway redeploy --service "$SERVICE" --yes
          echo "Railway accepted a redeploy for the web service."

      # An accepted redeploy means the platform queued a build, not that the
      # build succeeded. Say so, rather than letting a green check here be read
      # as a green deploy.
      - name: Summarise
        run: |
          if [ "${{ steps.gate.outputs.enabled }}" != "true" ]; then
            {
              echo "### Deploy skipped"
              echo "\`DEPLOY_ENABLED\` is not set to \`true\`. See DEPLOYMENT.md."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Railway redeploy requested"
            echo "Railway has **queued** a build for each configured service. Watch the"
            echo "project dashboard for the outcome — a queued build is not a finished one."
          } >> "$GITHUB_STEP_SUMMARY"
