name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch cancels the run already in flight, so the
# queue never fills with builds nobody is waiting on.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # The server env loader validates at import time, so the test run needs a
      # valid configuration before any module loads. These are CI-only constants
      # with no production meaning; tests/setup.ts supplies the same shape
      # locally. NODE_ENV stays unset here: jest sets it to `test` itself.
      MONGO_URI: mongodb://127.0.0.1:27017/internship_tracker_ci
      JWT_ACCESS_SECRET: ci-access-secret-not-used-outside-github-actions
      JWT_REFRESH_SECRET: ci-refresh-secret-not-used-outside-github-actions
      LOG_LEVEL: error
      ENABLE_CRON: 'false'

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # mongodb-memory-server downloads a mongod binary on first use. Cached it
      # is a few seconds; uncached it dominates the run and can fail on a flaky
      # download, which would make CI red for a reason unrelated to the code.
      - name: Cache the in-memory MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Coverage rather than a plain test run: SPEC section 10 asks for the
      # report to be printed, and server/jest.config.js fails the job if the
      # services or controllers directories drop below the target.
      - name: Test the server with coverage
        run: npm run test:coverage
        env:
          MONGOMS_DOWNLOAD_DIR: ~/.cache/mongodb-binaries

      - name: Test the client
        run: npm run test -w client

      - name: Build
        run: npm run build

      # SPEC section 12's performance budget, checked against the built output:
      # the landing route under 150 KB gzipped with Chart.js, dnd-kit and the
      # markdown pair provably absent from its static import closure.
      - name: Check the bundle budget
        run: npm run check:bundle

  e2e:
    name: playwright end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Only after the unit suites are green. An end-to-end run that fails because
    # of something `verify` would have caught costs several minutes to tell you
    # what a few seconds of lint already knew.
    needs: verify

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only Chromium. SPEC section 10 asks for the flows, not a browser matrix,
      # and `--with-deps` installs the shared libraries the runner image lacks.
      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      # The real stack, which is the whole point of this job: a real API, a real
      # Mongo, and a real cross-origin boundary between the client and the API.
      # That boundary is what surfaced the missing `Access-Control-Expose-Headers`
      # in Phase 15 — same-origin development never showed it.
      - name: Start the end-to-end stack
        run: npm run e2e:up

      - name: Wait for the stack to answer
        run: |
          for attempt in $(seq 1 60); do
            api=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5001/health || true)
            web=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5174/ || true)
            if [ "$api" = "200" ] && [ "$web" = "200" ]; then
              echo "stack ready after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "stack did not become ready"
          docker compose -p internship-tracker-e2e -f docker-compose.yml -f docker-compose.e2e.yml logs
          exit 1

      - name: Run the Playwright suite
        run: npm run test:e2e

      # The API log carries the console mail transport's output, which is where
      # the verification and reset tokens come from. On a failure it is usually
      # the first thing worth reading.
      - name: Dump the API log on failure
        if: failure()
        run: npm run e2e:logs -- --no-log-prefix --tail 400

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: npm run e2e:down
